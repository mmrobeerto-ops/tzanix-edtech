<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Tzanix Quantum Engine</title>
    <!-- Google Fonts for Brutalist/Technical Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,900;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 3D WebGL Canvas Container -->
    <div id="app"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
      <header class="top-bar">
        <div class="logo">
          <h1 class="logo-text">
            <span class="logo-tzan">TZAN</span>
            <!-- Custom SVG 'i' — punto cyan + tallo blanco geométrico -->
            <svg viewBox="0 0 24 42" class="logo-svg-i" aria-hidden="true">
              <!-- Punto Cyan -->
              <circle cx="12" cy="6" r="6" fill="#00f0ff" style="filter:drop-shadow(0px 0px 8px #00f0ff)" />
              <!-- Tallo geométrico blanco -->
              <g fill="white" style="filter:drop-shadow(0px 0px 10px rgba(255,255,255,0.2))">
                <path d="M 8 16 L 18 16 L 18 34 L 7 17.5 Q 6 16 8 16 Z" />
                <path d="M 16 42 L 6 42 L 6 24 L 17 40.5 Q 18 42 16 42 Z" />
              </g>
            </svg>
            <span class="logo-tzan">X</span>
            <span class="logo-edtech">EDTECH</span>
          </h1>
        </div>
      </header>

      <main class="info-panel" id="info-panel">
        <div class="panel-header-row">
          <div class="panel-title-group">
            <h2 id="info-title">Fase 1: Nube de Probabilidad</h2>
            <p id="info-desc">Sin observación, la partícula existe en superposición cuántica (0s - 10s).</p>
          </div>
          <!-- Botón para plegar / desplegar información en móviles y pantallas pequeñas -->
          <button id="btn-minimize-panel" class="panel-minimize-btn" title="Plegar / desplegar panel" aria-label="Plegar panel">
            <span id="minimize-icon">▲</span>
          </button>
        </div>

        <!-- Barra de progreso interactiva en tiempo real -->
        <div class="sim-progress-container" id="sim-progress-container">
          <div class="sim-progress-header">
            <span id="sim-timer-badge" class="sim-timer-badge">⏱ 00:00 / 00:30 · Fase 1/3 (10s)</span>
            <span class="sim-live-dot" title="Simulación en tiempo real">● EN VIVO</span>
          </div>
          <div class="sim-progress-track">
            <div id="sim-progress-bar" class="sim-progress-bar" style="width: 0%;"></div>
          </div>
        </div>
        
        <div class="panel-collapsible-body" id="panel-body">
          <div class="metrics">
            <div class="metric">
              <span class="label">Frecuencia</span>
              <span class="value" id="metric-freq">1.50 Hz</span>
            </div>
            <div class="metric">
              <span class="label">Resolución</span>
              <span class="value" id="metric-res">0.01</span>
            </div>
            <div class="metric">
              <span class="label">Capacidad</span>
              <span class="value" id="metric-cap">100</span>
            </div>
          </div>

          <button id="btn-start-sim" class="btn-play-power">⚡ ENCENDER SIMULACIÓN (30s)</button>
        </div>
      </main>

      <!-- ② BARRA DE COMPARTIR (esquina inferior izquierda) -->
      <div class="share-bar">
        <button id="btn-screenshot" class="share-btn" title="Capturar imagen en alta resolución">
          <span>📸</span><span class="share-label">CAPTURAR</span>
        </button>
        <button id="btn-share" class="share-btn" title="Copiar enlace con los parámetros actuales">
          <span>🔗</span><span class="share-label">COMPARTIR</span>
        </button>
      </div>

      <!-- Botón Flotante de Ajustes (reubicado a la esquina inferior derecha) -->
      <button id="btn-toggle-gui" class="fab-ajustes" title="Ajustes de parámetros cuánticos" aria-label="Ajustes de parámetros">
        <span class="gui-btn-icon">⚙️</span>
        <span class="gui-btn-label">AJUSTES</span>
      </button>

      <!-- ① GANCHO VISUAL: hint que desaparece al primer toque -->
      <div id="touch-hint" aria-hidden="true">
        <div class="hint-inner">
          <span class="hint-icon">✦</span>
          <span class="hint-text">TOCA LA PANTALLA PARA COLAPSAR LA ONDA</span>
          <span class="hint-icon">✦</span>
        </div>
      </div>

      <!-- ③ TOOLTIP DIDÁCTICO flotante -->
      <div id="param-tooltip" class="param-tooltip" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
