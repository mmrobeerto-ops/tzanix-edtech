<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tzanix Quantum Engine</title>
    <!-- Google Fonts for Brutalist/Technical Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,700;0,900;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 3D WebGL Canvas Container -->
    <div id="app"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
      <header class="top-bar">
        <div class="logo">
          <h1 class="logo-text">
            <span class="logo-tzan">TZAN</span>
            <!-- Custom SVG 'i' — punto cyan + tallo blanco geométrico -->
            <svg viewBox="0 0 24 42" class="logo-svg-i" aria-hidden="true">
              <!-- Punto Cyan -->
              <circle cx="12" cy="6" r="6" fill="#00f0ff" style="filter:drop-shadow(0px 0px 8px #00f0ff)" />
              <!-- Tallo geométrico blanco -->
              <g fill="white" style="filter:drop-shadow(0px 0px 10px rgba(255,255,255,0.2))">
                <path d="M 8 16 L 18 16 L 18 34 L 7 17.5 Q 6 16 8 16 Z" />
                <path d="M 16 42 L 6 42 L 6 24 L 17 40.5 Q 18 42 16 42 Z" />
              </g>
            </svg>
            <span class="logo-tzan">X</span>
            <span class="logo-edtech">EDTECH</span>
          </h1>
        </div>
      </header>

      <main class="info-panel" id="info-panel">
        <h2 id="info-title">Inicializando...</h2>
        <p id="info-desc">Cargando motor cuántico y conectando a WebAssembly.</p>
        
        <div class="metrics">
          <div class="metric">
            <span class="label">Frecuencia de Onda</span>
            <span class="value" id="metric-freq">0.00 Hz</span>
          </div>
          <div class="metric">
            <span class="label">Resolución</span>
            <span class="value" id="metric-res">0.00</span>
          </div>
          <div class="metric">
            <span class="label">Capacidad</span>
            <span class="value" id="metric-cap">0</span>
          </div>
        </div>

        <button id="btn-start-sim" class="btn-play">▶ Iniciar Simulación Educativa</button>
      </main>

      <!-- ① GANCHO VISUAL: hint que desaparece al primer toque -->
      <div id="touch-hint" aria-hidden="true">
        <div class="hint-inner">
          <span class="hint-icon">✦</span>
          <span class="hint-text">TOCA LA PANTALLA PARA COLAPSAR LA ONDA</span>
          <span class="hint-icon">✦</span>
        </div>
      </div>

      <!-- ③ TOOLTIP DIDÁCTICO flotante -->
      <div id="param-tooltip" class="param-tooltip" aria-live="polite"></div>

      <!-- ② BARRA DE COMPARTIR (bottom-left) -->
      <div class="share-bar">
        <button id="btn-screenshot" class="share-btn" title="Capturar imagen en alta resolución">
          <span>📸</span><span class="share-label">CAPTURAR</span>
        </button>
        <button id="btn-share" class="share-btn" title="Copiar enlace con los parámetros actuales">
          <span>🔗</span><span class="share-label">COMPARTIR</span>
        </button>
      </div>

      <!-- Bottom bar: Advanced toggle (desktop only) -->
      <div class="bottom-bar">
        <button id="btn-advanced" class="glass-btn">PARÁMETROS AVANZADOS</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
